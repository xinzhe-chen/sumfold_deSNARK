name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        run: |
          rustup toolchain install nightly-2026-02-22 --profile minimal --component rustfmt --component clippy
          rustup default nightly-2026-02-22

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Release Check
        run: make release-check
